spring.application.name=Drivers
server.port=8084

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# Activer le profil dev par defaut
spring.profiles.active=dev

# Configuration datasource
spring.datasource.url=jdbc:mysql://localhost:3306/Drivers?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Configuration JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.servlet.context-path=/api

# Exposer les endpoints health, info et metrics (seul health l'est par défaut)
management.endpoints.web.exposure.include=health,info,metrics
# Afficher le détail des composants dans /health (db, diskSpace, ping…)
management.endpoint.health.show-details=always
# Variante : afficher les composants sans leurs détails
#management.endpoint.health.show-components=always
# Transmettre à Eureka le statut de /health (Job passe DOWN si la base tombe)
eureka.client.healthcheck.enabled=true
# Publier les propriétés info.* dans /actuator/info (désactivé par défaut)
management.info.env.enabled=true
# Contenu affiché par /actuator/info
info.app.name=Drivers
info.app.version=1.0.0
info.app.description=Microservice de gestion des chauffeurs
info.app.team=LockIn